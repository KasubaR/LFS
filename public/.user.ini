; Per-directory PHP settings (read by PHP-FPM/CGI on cPanel; re-read every ~5 minutes).
; Gallery videos are allowed up to 200 MB, so the limits must exceed that.
upload_max_filesize = 210M
post_max_size = 220M
max_file_uploads = 60
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Never print PHP warnings into responses (causes "headers already sent").
display_errors = Off
log_errors = On
